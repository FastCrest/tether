name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python:
    name: Python runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU serving dependency surface
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c 'import importlib.metadata as m; print("torch==" + m.version("torch"))' > /tmp/audit-cpu-constraints.txt
          python -m pip install -c /tmp/audit-cpu-constraints.txt ".[serve,onnx]"
          python -m pip check
          python .github/scripts/audit_requirements.py > audit-requirements.txt
      - name: Audit exact installed runtime versions
        run: |
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit --strict --disable-pip --no-deps -r audit-requirements.txt --format json --output python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-dependency-audit
          path: |
            audit-requirements.txt
            python-audit.json
          if-no-files-found: error

  npm:
    name: npm Worker dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [contribution-worker, data-worker, license-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve manifests without install scripts and audit all severities
        working-directory: infra/${{ matrix.worker }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --audit-level=low --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-${{ matrix.worker }}
          path: infra/${{ matrix.worker }}/npm-audit.json
          if-no-files-found: error
