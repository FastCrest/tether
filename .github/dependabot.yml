version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories:
      - "/infra/contribution-worker"
      - "/infra/data-worker"
      - "/infra/license-worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
