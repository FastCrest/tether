name = "reflex-contributions"
main = "worker.js"
compatibility_date = "2026-05-01"

# Scheduled events and /internal/maintenance only reconcile uploads/nonces.
# Destructive revocation requires a verified request and explicit admin execution.
[triggers]
# The recovery coordinator owns the shared maintenance/backup schedule.
# This Worker consumes no extra cron slot; its scheduler cannot advance purges.
crons = []

# D1 binding for contributor metadata + upload tracking + revoke cascade.
# Fill in `database_id` after `wrangler d1 create reflex-contributions`.
[[d1_databases]]
binding = "DB"
database_name = "reflex-contributions"
database_id = "39cc37c0-524c-4a7a-921e-76cc44cb1494"

# R2 binding for the actual contribution payloads. Bucket created via
# `wrangler r2 bucket create reflex-curate`. Layout per spec:
#   free-contributors/<contributor_id>/<date>/<session>.jsonl
#   pro-contributors/<customer_id>/<date>/<session>.jsonl
#   derived-datasets/v<n>/<dataset_slug>/...
[[r2_buckets]]
binding = "CURATE_BUCKET"
bucket_name = "reflex-curate"

# One coordination atom per contributor serializes payload writes and terminal
# purge so D1/R2 cross-service races cannot create post-purge objects.
[[durable_objects.bindings]]
name = "CONTRIBUTOR_STORAGE"
class_name = "ContributorStorageFence"

[[migrations]]
tag = "contributor-storage-fence-v1"
new_sqlite_classes = ["ContributorStorageFence"]

# Optional: bind a custom domain after first deploy.
# routes = [{ pattern = "data.fastcrest.com/*", custom_domain = true }]

# Required Secrets (set via `wrangler secret put`):
#   ADMIN_TOKEN                — bearer token for admin + revoke mutations
#   MAINTENANCE_TOKEN          — distinct maintenance-only bearer, shared with coordinator
#   SLACK_WEBHOOK_URL          — optional; alert on revoke + suspicious uploads
